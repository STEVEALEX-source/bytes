<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bytes — storage converter</title>
<style>
body{font:15px/1.4 system-ui,sans-serif;max-width:420px;margin:40px auto;padding:0 16px;color:#222}
h1{font-size:1.4rem;font-weight:600;margin:0 0 4px}
p{color:#666;margin:0 0 20px;font-size:.9rem}
label{display:block;font-size:.8rem;color:#555;margin-bottom:4px}
.row{display:flex;gap:8px;margin-bottom:16px}
input,select{font:inherit;padding:8px 10px;border:1px solid #ccc;border-radius:6px}
input{flex:1;min-width:0}
select{width:90px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td{padding:7px 0;border-bottom:1px solid #eee}
td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace}
.binary{color:#888;font-size:.8rem}
footer{margin-top:28px;font-size:.75rem;color:#aaa}
</style>
</head>
<body>
<h1>bytes</h1>
<p>Convert between decimal and binary storage units.</p>

<label for="v">Value</label>
<div class="row">
<input id="v" type="number" value="1" step="any" min="0">
<select id="u">
<option value="1">B</option>
<option value="1000">KB</option>
<option value="1e6" selected>MB</option>
<option value="1e9">GB</option>
<option value="1e12">TB</option>
<option value="1024">KiB</option>
<option value="1048576">MiB</option>
<option value="1073741824">GiB</option>
<option value="1099511627776">TiB</option>
</select>
</div>

<table id="out"></table>

<footer>decimal (KB/MB) vs binary (KiB/MiB) · under 5 KB</footer>

<script>
const units=[
["B",1],["KB",1e3],["MB",1e6],["GB",1e9],["TB",1e12],
["KiB",1024],["MiB",1048576],["GiB",1073741824],["TiB",1099511627776]
];
function fmt(n){
if(n===0)return"0";
if(n>=1e12)return n.toExponential(4);
if(n>=1e6)return n.toLocaleString(undefined,{maximumFractionDigits:2});
if(n>=1)return n.toLocaleString(undefined,{maximumFractionDigits:4});
return n.toPrecision(4);
}
function run(){
const bytes=+v.value*+u.value||0;
out.innerHTML=units.map(([n,f])=>{
const val=bytes/f;
const isBin=n.includes("i");
return`<tr><td>${n}${isBin?' <span class="binary">binary</span>':''}</td><td>${fmt(val)}</td></tr>`;
}).join("");
}
v.oninput=u.onchange=run;
run();
</script>
</body>
</html>
